name: Update maestro-runner cask

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-maestro-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update cask
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: devicelab-dev/maestro-runner
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$({
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/latest"
          } | jq --exit-status --raw-output '.tag_name')"

          if [[ ! "${latest_tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Unexpected release tag: ${latest_tag}" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          current_version="$(ruby -ne 'puts Regexp.last_match(1) if /^  version "([^"]+)"/' Casks/maestro-runner.rb)"

          if [[ "${version}" == "${current_version}" ]]; then
            echo "maestro-runner ${version} is already current."
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_url="https://github.com/${UPSTREAM_REPOSITORY}/releases/download/${latest_tag}"
          arm_sha="$(curl --fail --silent --show-error --location \
            "${release_url}/maestro-runner-${version}-darwin-arm64.tar.gz.sha256" | cut -d ' ' -f 1)"
          intel_sha="$(curl --fail --silent --show-error --location \
            "${release_url}/maestro-runner-${version}-darwin-amd64.tar.gz.sha256" | cut -d ' ' -f 1)"

          if [[ ! "${arm_sha}" =~ ^[0-9a-f]{64}$ ]] || [[ ! "${intel_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "A release checksum has an unexpected format." >&2
            exit 1
          fi

          # Perl expands these environment variables and capture groups, not the shell.
          # shellcheck disable=SC2016
          VERSION="${version}" ARM_SHA="${arm_sha}" INTEL_SHA="${intel_sha}" perl -0pi -e '
            s/version "[^"]+"/version "$ENV{VERSION}"/;
            s/(sha256 arm:\s+)"[0-9a-f]+",(\s+intel:\s+)"[0-9a-f]+"/$1"$ENV{ARM_SHA}",$2"$ENV{INTEL_SHA}"/;
          ' Casks/maestro-runner.rb

          ruby -c Casks/maestro-runner.rb
          git diff --check

          if git diff --quiet -- Casks/maestro-runner.rb; then
            echo "The release differs, but the cask was not changed." >&2
            exit 1
          fi

          echo "updated=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit update
        if: steps.update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/maestro-runner.rb
          git commit -m "Update maestro-runner to ${VERSION}"
          git push
